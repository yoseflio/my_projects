version: '3.8'

services:
  kafka:
    image: confluentinc/cp-kafka:7.9.11
    container_name: shop-kafka
    ports:
      - "9092:9092"

    environment:
      KAFKA_KRAFT_MODE: 'true'

      CLUSTER_ID: 'FRecD5ZgRammZx1p7_JAJQ'
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker, controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kakfa:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092, CONTOLLERL//0.0.0.0:9093
      KAFKA_ADVERTISEDE_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTOLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs

    volumes:
      - kafka_kraft: /var/lib/kafka/data

volumes:
  kafka_kraft:

